---
# Vector log shipping runs on all doma hosts
- hosts: doma
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - vector

# OpenClaw gateway host: dev tools + gateway service + companion scripts + ledger sync
- hosts: openclaw_host
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - dev
    - openclaw-base
    - openclaw-scripts
    - ledger-sync

- hosts: plankton.local
  gather_facts: no
  become: yes
  roles:
    # - plex # set up user before storage
    - storage
    # - dns_authority

  vars:
    storage_mount_point: /mnt/usbmedia
    storage_uuid: A6BCA8B3BCA88003
