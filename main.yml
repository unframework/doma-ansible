---
# Vector log shipping runs on all doma hosts
- hosts: doma
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - { role: vector, tags: ['vector'] }
    - { role: known-hosts, tags: ['known-hosts'] }

# mDNS publishing (sandy only; plankton's avahi is left as-is)
- hosts: avahi_host
  gather_facts: yes
  become: no
  roles:
    - { role: avahi, tags: ['avahi'] }

# OpenClaw gateway host: dev tools + gateway service + companion scripts + ledger sync.
# Live on sandy; plankton is still a member but its units are templated inactive
# via host_vars until it is retired.
- hosts: openclaw_host
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - { role: dev, tags: ['dev'] }
    - { role: openclaw-base, tags: ['openclaw-base'] }
    - { role: openclaw-scripts, tags: ['openclaw-scripts'] }
    - { role: ledger-sync, tags: ['ledger-sync'] }

# Workspace web — Telegram Mini App timeline server (sandy; it needs the
# openclaw timeline data that lives on the gateway host, and the bot token from
# the vault)
- hosts: webapp_host
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - { role: workspace-web, tags: ['workspace-web'] }

# Containerised PBX (sandy only; plankton's hand-built Asterisk 16 is untouched)
- hosts: asterisk_host
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - { role: asterisk, tags: ['asterisk'] }

# Host firewall
- hosts: firewall_host
  gather_facts: yes
  become: no
  roles:
    - { role: ufw, tags: ['ufw'] }

# TFTP firmware server for the Mitel desk phone
- hosts: tftp_host
  gather_facts: yes
  become: no
  roles:
    - { role: tftpd, tags: ['tftpd'] }

# Home Assistant + Music Assistant compose stack (sandy only)
- hosts: docker_host
  gather_facts: yes
  become: no
  roles:
    - { role: docker-stack, tags: ['docker-stack'] }

# Herd agent session server (both hosts, in parallel)
- hosts: herd_host
  gather_facts: yes
  become: no
  roles:
    - { role: herd, tags: ['herd'] }

# drone-server generative audio engine, on-demand user units (sandy only)
- hosts: drone_host
  gather_facts: yes
  become: no
  roles:
    - { role: drone-server, tags: ['drone-server'] }

- hosts: plankton.local
  gather_facts: no
  become: yes
  roles:
    # - plex # set up user before storage
    - storage
    # - dns_authority

  vars:
    storage_mount_point: /mnt/usbmedia
    storage_uuid: A6BCA8B3BCA88003
