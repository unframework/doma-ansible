---
# Vector log shipping runs on all doma hosts
- hosts: doma
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - vector

# OpenClaw gateway host: dev tools + gateway service + companion scripts + ledger sync
- hosts: openclaw_host
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - { role: dev, tags: ['dev'] }
    - { role: openclaw-base, tags: ['openclaw-base'] }
    - { role: openclaw-scripts, tags: ['openclaw-scripts'] }
    - { role: ledger-sync, tags: ['ledger-sync'] }

# Workspace web — Telegram Mini App timeline server (plankton only; it needs
# the openclaw timeline data + bot token that live on the gateway host)
- hosts: webapp_host
  gather_facts: yes
  become: no
  roles:
    - { role: workspace-web, tags: ['workspace-web'] }

- hosts: plankton.local
  gather_facts: no
  become: yes
  roles:
    # - plex # set up user before storage
    - storage
    # - dns_authority

  vars:
    storage_mount_point: /mnt/usbmedia
    storage_uuid: A6BCA8B3BCA88003
