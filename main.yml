---
# Vector log shipping runs on all doma hosts
- hosts: doma
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - vector

# plankton-only: ledger sync + openclaw scripts
- hosts: plankton.local
  gather_facts: yes
  become: no
  vars_files:
    - vars/secrets.yml
  roles:
    - ledger-sync
    - openclaw-scripts

- hosts: plankton.local
  gather_facts: no
  become: yes
  roles:
    # - plex # set up user before storage
    - storage
    # - dns_authority

  vars:
    storage_mount_point: /mnt/usbmedia
    storage_uuid: A6BCA8B3BCA88003
