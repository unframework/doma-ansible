---
# sandy-specific vector settings
vector_host_name: sandy

# No user-service filter yet — sandy currently has no openclaw/ledger/obsidian
# When those get added, list substrings here to filter user units
vector_log_unit_filters:
  - "openclaw"
  - "ledger-"
  - "obsidian"
  - "herd"

# No custom file sources yet
vector_file_sources:
  - name: "ledger"
    path: "{{ ansible_env.HOME }}/ledger-data/.git/ledger/sync.log"

# Ship system journal on sandy — it's Tailscale-reachable, useful for auditing
vector_include_system_journal: true

# Focus on interesting system units; empty list would ship everything
vector_system_journal_units:
  - "ssh.service"
  - "sshd.service"
  - "tailscaled.service"
  - "systemd-logind.service"
  - "ufw.service"
  - "unattended-upgrades.service"
  - "fail2ban.service"

# Pre-seed posture: units are templated here so the host is ready, but nothing
# runs until cutover. Two hosts sharing the my-docs clone, the ledger remote,
# the Better Stack heartbeat or the Telegram long-poll would collide.
openclaw_scripts_active: true
openclaw_gateway_enabled: true

# sandy ships to its own Better Stack source (sandy_server). Newer sources are
# bound to a dedicated ingest host; the shared in.logs endpoint rejects their
# tokens. Not a secret, so it lives here rather than in the vault.
vector_betterstack_uri: "https://s2763957.us-west-2a.betterstackdata.com"

# HA + Music Assistant cut over to sandy on 2026-09-16, when the Zigbee dongle
# was physically moved. plankton's stack is stopped and cannot run without the
# radio.
docker_stack_active: true
