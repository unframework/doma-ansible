---
# plankton-specific vector settings
vector_host_name: plankton

vector_log_unit_filters:
  - "openclaw"
  - "ledger-"
  - "obsidian"

vector_file_sources:
  - name: "ledger"
    path: "{{ ansible_env.HOME }}/ledger-data/.git/ledger/sync.log"

# plankton doesn't currently ship system journal
vector_include_system_journal: false

# Paused out-of-band on 2026-08-23 while Nick travelled. Recorded here so a
# playbook run converges on the paused state instead of resurrecting the tick.
# Resuming also needs ~/.openclaw/timeline/.tick-cursor reset to now, or the
# whole paused stretch of markers replays into one turn.
openclaw_scripts_unit_overrides:
  openclaw-timeline-tick.timer: false

# Workload cut over to sandy 2026-09-16. Units stay templated here so the host
# can be brought back, but nothing runs. herd is deliberately excluded — it is
# in herd_host and keeps running on both boxes.
openclaw_scripts_active: false
openclaw_gateway_enabled: false
