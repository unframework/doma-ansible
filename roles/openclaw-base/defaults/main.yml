---
# openclaw-base defaults — installs the openclaw npm CLI + gateway systemd unit.
# Values match plankton's current state so re-runs on plankton are no-ops.

# Pinned openclaw npm version. Bump this variable + rerun to update.
# Note: this is the version installed via npm. openclaw_service_version below
# is a separate label baked into the systemd unit's Environment= lines and
# only bumped when the unit file itself is intentionally re-templated.
openclaw_version: "2026.5.28"

# Node version whose npm/bin dirs the gateway service runs against.
# Should be present under nvm (installed by the `dev` role).
openclaw_node_version: "v22.21.1"

# Systemd unit knobs. Defaults freeze plankton's current unit content.
openclaw_service_version: "2026.3.2"    # baked into Description + OPENCLAW_SERVICE_VERSION
openclaw_gateway_port: 18789
# Requires a working NVIDIA driver, not merely a GPU. sandy has a Quadro T400
# but no driver installed, so enabling this there would fail at startup.
openclaw_service_node_llama_gpu: false

openclaw_service_path_dirs:
  - "{{ ansible_env.HOME }}/.nvm/current/bin"
  - "{{ ansible_env.HOME }}/.local/bin"
  - "{{ ansible_env.HOME }}/.npm-global/bin"
  - "{{ ansible_env.HOME }}/bin"
  - "{{ ansible_env.HOME }}/.volta/bin"
  - "{{ ansible_env.HOME }}/.asdf/shims"
  - "{{ ansible_env.HOME }}/.bun/bin"
  - "{{ ansible_env.HOME }}/.fnm/current/bin"
  - "{{ ansible_env.HOME }}/.local/share/pnpm"
  - /usr/local/bin
  - /usr/bin
  - /bin

openclaw_service_path: "{{ openclaw_service_path_dirs | join(':') }}"

# Tailscale Serve in front of the loopback gateway. Tailnet-only, never Funnel:
# the gateway is the agent's full control surface. This was hand-made on
# plankton and owned by no role, which is why it kept getting lost.
openclaw_tailscale_serve: true
openclaw_tailscale_https_port: 443
openclaw_bind_host: "127.0.0.1"

# Whether the gateway runs on this host. False disables and stops it — the
# posture for a host holding the workload only as a fallback.
openclaw_gateway_enabled: true

# openclaw_gateway_token: loaded from vaulted vars/secrets.yml
