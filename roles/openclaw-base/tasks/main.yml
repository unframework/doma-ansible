---
# openclaw-base — install the openclaw CLI (npm global) + template the gateway
# systemd user service. Idempotent: no-op when target already matches.

- name: Ensure openclaw npm package is installed at pinned version
  community.general.npm:
    name: openclaw
    version: "{{ openclaw_version }}"
    global: true
    executable: "{{ ansible_env.HOME }}/.nvm/versions/node/{{ openclaw_node_version }}/bin/npm"
  environment:
    PATH: "{{ ansible_env.HOME }}/.nvm/versions/node/{{ openclaw_node_version }}/bin:{{ ansible_env.PATH }}"

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Template openclaw-gateway.service unit
  ansible.builtin.template:
    src: openclaw-gateway.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-gateway.service"
    mode: '0644'   # matches existing; ~/.config is 0700 so token is not exposed
  notify: Reload systemd user

- name: Template openclaw runtime env
  ansible.builtin.template:
    src: state-env.j2
    dest: "{{ ansible_env.HOME }}/.openclaw/.env"
    mode: '0600'
  notify: Restart openclaw gateway

- name: Converge openclaw-gateway activation
  ansible.builtin.systemd:
    name: openclaw-gateway.service
    enabled: "{{ openclaw_gateway_enabled }}"
    state: "{{ 'started' if openclaw_gateway_enabled else 'stopped' }}"
    scope: user
    daemon_reload: true

- name: Read current Tailscale serve config
  ansible.builtin.command: tailscale serve status --json
  register: openclaw_serve_status
  changed_when: false
  failed_when: false
  become: true
  when: openclaw_tailscale_serve | bool

- name: Collect HTTPS ports currently proxying to the gateway
  ansible.builtin.set_fact:
    openclaw_serve_ports: >-
      {{ ((((openclaw_serve_status.stdout | default('') | trim) or '{}') | from_json).get('Web') or {})
         | dict2items
         | selectattr('value.Handlers', 'defined')
         | selectattr('value.Handlers', 'contains', '/')
         | selectattr('value.Handlers./.Proxy', 'defined')
         | selectattr('value.Handlers./.Proxy', 'equalto', 'http://' ~ openclaw_bind_host ~ ':' ~ openclaw_gateway_port)
         | map(attribute='key') | map('regex_replace', '^.*:', '') | list }}
  when: openclaw_tailscale_serve | bool

- name: Configure Tailscale Serve for the gateway (tailnet-only HTTPS)
  ansible.builtin.command:
    cmd: "tailscale serve --bg --https={{ openclaw_tailscale_https_port }} {{ openclaw_gateway_port }}"
  become: true
  when:
    - openclaw_tailscale_serve | bool
    - openclaw_gateway_enabled | bool
    - (openclaw_tailscale_https_port | string) not in openclaw_serve_ports

- name: Remove stale gateway Serve mappings on other ports
  ansible.builtin.command:
    cmd: "tailscale serve --https={{ item }} off"
  become: true
  loop: "{{ openclaw_serve_ports | default([]) | difference([openclaw_tailscale_https_port | string]) }}"
  when: openclaw_tailscale_serve | bool
