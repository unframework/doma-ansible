---
# Dev role defaults — general-purpose dev tooling for a doma host.
# Idempotent: skips installs when target binaries already exist.

# Node via nvm — pinned to what's already installed on plankton so re-runs are no-ops.
dev_nvm_version: "v0.39.7"          # nvm installer script version (only used if nvm absent)
dev_node_version: "v22.21.1"        # default node version managed via nvm

# Claude Code CLI — use the official installer script, which manages its own version.
# Setting to "latest" leaves the existing install untouched if already present.
dev_install_claude: true

# GitHub CLI — via the official apt repo. Idempotent (apt handles version check).
dev_install_gh: true

# yoclaude alias — dangerous-permissions wrapper for claude
dev_yoclaude_alias: "alias yoclaude='claude --dangerously-skip-permissions'"
