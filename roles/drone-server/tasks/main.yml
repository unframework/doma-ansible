---
- name: Install SuperCollider, its plugins, and OSC CLI tools
  ansible.builtin.apt:
    name:
      - supercollider-server
      - supercollider-language
      - sc3-plugins
      - liblo-tools
    state: present
  become: true

- name: Let the audio group acquire realtime scheduling through RTKit without a local seat
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/50-rtkit-audio.rules
    content: |
      polkit.addRule(function (action, subject) {
        if (action.id == "org.freedesktop.RealtimeKit1.acquire-real-time" && subject.isInGroup("audio")) {
          return polkit.Result.YES;
        }
      });
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Template drone-server units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ item }}"
    mode: '0644'
  loop:
    - drone-engine.service
    - drone-watch.service
    - drone-cast@.service
    - drone-web.service
  notify:
    - Reload systemd user
    - Restart drone-web

- name: Link dronectl onto PATH
  ansible.builtin.file:
    src: "{{ drone_server_dir }}/ctl.sh"
    dest: "{{ ansible_env.HOME }}/.local/bin/dronectl"
    state: link

- name: Check that the drone-web bundle is built
  ansible.builtin.stat:
    path: "{{ drone_server_dir }}/web/dist/server.cjs"
  register: drone_web_bundle

- name: Enable and start drone-web
  ansible.builtin.systemd:
    name: drone-web.service
    enabled: true
    state: started
    scope: user
    daemon_reload: true
  when: drone_web_bundle.stat.exists

- name: Remind to build drone-web
  ansible.builtin.debug:
    msg: "drone-web not started: run `npm ci && npm run build` in {{ drone_server_dir }}/web, then re-run the playbook."
  when: not drone_web_bundle.stat.exists
