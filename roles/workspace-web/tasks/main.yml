---
# workspace-web — systemd user unit for the Telegram Mini App timeline server.
# The bundle under webapp_install_dir is deployed out-of-band (`yarn deploy`
# from ~/.openclaw/workspace/web).

- name: Check that the workspace-web bundle is present
  ansible.builtin.stat:
    path: "{{ webapp_install_dir }}/server/server.cjs"
  register: webapp_bundle_stat

- name: Fail early if the workspace-web bundle has not been deployed
  ansible.builtin.fail:
    msg: >-
      {{ webapp_install_dir }}/server/server.cjs is missing.
      Run `yarn deploy` in ~/.openclaw/workspace/web on this host first —
      Ansible does not ship the bundle.
  when: not webapp_bundle_stat.stat.exists

- name: Check that the pinned node version is installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.nvm/versions/node/{{ webapp_node_version }}/bin/node"
  register: webapp_node_stat

- name: Fail early if the pinned node version is missing
  ansible.builtin.fail:
    msg: "node {{ webapp_node_version }} not installed under nvm — run the `dev` role first."
  when: not webapp_node_stat.stat.exists

# Unset/empty means the server denies every request, which looks like a broken
# deploy rather than a config mistake. Catch it here instead.
- name: Fail early if no Telegram user IDs are allowlisted
  ansible.builtin.fail:
    msg: "webapp_allowed_user_ids is empty — the app would 401 every request."
  when: (webapp_allowed_user_ids | default([]) | length) == 0

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Template workspace-web.service unit
  ansible.builtin.template:
    src: workspace-web.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/workspace-web.service"
    mode: '0644'
  notify:
    - Reload systemd user
    - Restart workspace-web

- name: Enable and start workspace-web user service
  ansible.builtin.systemd:
    name: workspace-web.service
    enabled: true
    state: started
    scope: user
    daemon_reload: true

# ---------------------------------------------------------------------------
# Tailscale Funnel — public HTTPS in front of the loopback listener.
# Funnel rather than Serve because Telegram's webview loads the Mini App from
# outside the tailnet. Safe only because /api is gated on initData + allowlist;
# see the defaults for the full reasoning before widening anything here.
# Serve/Funnel writes need root (no tailscale operator user is set on these hosts).
# ---------------------------------------------------------------------------

- name: Read current Tailscale serve config
  ansible.builtin.command: tailscale serve status --json
  register: webapp_serve_status
  changed_when: false
  failed_when: false
  become: true
  when: webapp_funnel | bool

- name: Parse Tailscale serve config
  ansible.builtin.set_fact:
    webapp_serve_json: >-
      {{ ((webapp_serve_status.stdout | default('') | trim) or '{}') | from_json }}
  when: webapp_funnel | bool

# Web keys look like "<magicdns-name>:<port>", each with Handlers keyed by path.
# Match on the backend, not just the port: a bare port check cannot tell "already
# pointed at us" from "pointed at some other service", and a bare backend check
# cannot tell "on the right port" from "still on the old one".
- name: Collect HTTPS ports currently proxying to workspace-web
  ansible.builtin.set_fact:
    webapp_serve_ports: >-
      {{ ((webapp_serve_json.get('Web')) or {})
         | dict2items
         | selectattr('value.Handlers', 'defined')
         | selectattr('value.Handlers', 'contains', '/')
         | selectattr('value.Handlers./.Proxy', 'defined')
         | selectattr('value.Handlers./.Proxy', 'equalto', 'http://' ~ webapp_bind_host ~ ':' ~ webapp_port)
         | map(attribute='key') | map('regex_replace', '^.*:', '') | list }}
  when: webapp_funnel | bool

# A port can carry a proxy handler while Funnel is still off — that is exactly
# the tailnet-only Serve state. Track both so the role converges on "proxied
# AND publicly exposed" rather than stopping at a half-configured mapping.
- name: Collect ports with Funnel currently enabled
  ansible.builtin.set_fact:
    webapp_funnel_ports: >-
      {{ ((webapp_serve_json.get('AllowFunnel')) or {})
         | dict2items | selectattr('value') | map(attribute='key')
         | map('regex_replace', '^.*:', '') | list }}
  when: webapp_funnel | bool

- name: Enable Tailscale Funnel for workspace-web (public HTTPS)
  ansible.builtin.command:
    cmd: "tailscale funnel --bg --https={{ webapp_funnel_port }} {{ webapp_port }}"
  become: true
  when:
    - webapp_funnel | bool
    - (webapp_funnel_port | string) not in webapp_serve_ports
      or (webapp_funnel_port | string) not in webapp_funnel_ports

# Only ever tears down mappings whose backend is workspace-web's own loopback
# port, so unrelated Serve/Funnel entries on the host (the OpenClaw gateway on
# 443, herd on 8443) are untouched.
- name: Remove stale workspace-web mappings on other ports
  ansible.builtin.command:
    cmd: "tailscale funnel --https={{ item }} off"
  become: true
  loop: "{{ webapp_serve_ports | default([]) | difference([webapp_funnel_port | string]) }}"
  when: webapp_funnel | bool
