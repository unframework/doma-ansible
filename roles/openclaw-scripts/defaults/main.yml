---
# OpenClaw scripts role defaults

# Whether this host runs the openclaw companion workload. Setting it false parks
# every unit below in a disabled+stopped state — the posture for a host that has
# handed the workload off but stays available as a fallback.
openclaw_scripts_active: true

# Baseline activation per unit, ANDed with openclaw_scripts_active. A unit paused
# here is paused in git rather than out-of-band, so a playbook run cannot silently
# resurrect it. Override individual entries via openclaw_scripts_unit_overrides.
openclaw_scripts_unit_defaults:
  session-sweep.timer: true
  openclaw-my-docs-pull.timer: true
  openclaw-my-docs-sweep.timer: true
  openclaw-timeline-tick.timer: true
  obsidian-sync.service: true
  debug-log-forwarder.timer: false      # 2026-08-07: too noisy in the Telegram debug topic
  openclaw-sq-triage.timer: false       # 2026-07-08: paused

openclaw_scripts_unit_overrides: {}

# Better Stack heartbeat URLs, keyed by job. A job whose key is absent simply
# does not ping, so the playbook stays runnable before the monitor exists.
# Real values live in vars/secrets.yml.
betterstack_heartbeats: {}

# The my-docs editing clone: the agent's read/write surface for ledger content.
# Kept here rather than hardcoded in the script so the path stays config, not code.
my_docs_clone_dir: "{{ ansible_env.HOME }}/.openclaw/my-docs"

# Hourly at :00, ahead of openclaw-my-docs-sweep, which reads the refreshed clone.
my_docs_pull_schedule: "*:00"

# Daily housekeeping pass over the clone, reported to the agent as an inbox event.
# Files untouched for under an hour are skipped so a live session mid-edit is left
# alone; the file cap keeps one bad morning from filling the event with noise.
my_docs_sweep_schedule: "06:20"
my_docs_sweep_min_age_hours: 1
my_docs_sweep_max_files: 10

# qmd search collections. Notion points at the editing clone (not the sync
# remote) so search results map to files the agent can actually edit. Note this
# indexes git-tracked content only: gitignored archived hierarchies that exist
# on the remote's disk are deliberately not searchable.
qmd_collections:
  Commentary:
    path: "{{ ansible_env.HOME }}/.obsidian/Commentary"
    pattern: "**/*.md"
  Notion:
    path: "{{ my_docs_clone_dir }}/notion"
    pattern: "**/*.md"
