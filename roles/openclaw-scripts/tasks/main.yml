---
- name: Ensure user systemd directory exists
  file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: '0755'

# Session Sweep
- name: Template session-sweep service
  template:
    src: session-sweep.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/session-sweep.service"
    mode: '0644'
  notify: Reload systemd user

- name: Template session-sweep timer
  template:
    src: session-sweep.timer.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/session-sweep.timer"
    mode: '0644'
  notify: Reload systemd user

- name: Enable and start session-sweep timer
  systemd:
    name: session-sweep.timer
    enabled: yes
    state: started
    scope: user
    daemon_reload: yes

# Debug Log Forwarder
- name: Template debug-log-forwarder service
  template:
    src: debug-log-forwarder.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/debug-log-forwarder.service"
    mode: '0644'
  notify: Reload systemd user

- name: Template debug-log-forwarder timer
  template:
    src: debug-log-forwarder.timer.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/debug-log-forwarder.timer"
    mode: '0644'
  notify: Reload systemd user

# Disabled 2026-08-07: paused per Nick — too noisy in Telegram debug topic. Flip back to enabled=yes/state=started to resume.
- name: Disable and stop debug-log-forwarder timer
  systemd:
    name: debug-log-forwarder.timer
    enabled: no
    state: stopped
    scope: user
    daemon_reload: yes

# SQ Triage Sub-agent
- name: Template openclaw-sq-triage service
  template:
    src: openclaw-sq-triage.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-sq-triage.service"
    mode: '0644'
  notify: Reload systemd user

- name: Template openclaw-sq-triage timer
  template:
    src: openclaw-sq-triage.timer.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-sq-triage.timer"
    mode: '0644'
  notify: Reload systemd user

# Disabled 2026-07-08: paused per Nick. Flip back to enabled=yes/state=started to resume.
- name: Disable and stop openclaw-sq-triage timer
  systemd:
    name: openclaw-sq-triage.timer
    enabled: no
    state: stopped
    scope: user
    daemon_reload: yes

# Main Session Reset: retired 2026-07-09. Replaced with agents.defaults.session.resetByType.direct in openclaw.json.
- name: Ensure openclaw-main-session-reset timer is stopped and disabled
  systemd:
    name: openclaw-main-session-reset.timer
    enabled: no
    state: stopped
    scope: user
    daemon_reload: yes
  failed_when: false

- name: Remove openclaw-main-session-reset timer unit
  file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-main-session-reset.timer"
    state: absent
  notify: Reload systemd user

- name: Remove openclaw-main-session-reset service unit
  file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-main-session-reset.service"
    state: absent
  notify: Reload systemd user

# SQ Import (Notion todos): retired 2026-08-17. sq-import-todos.py was unused and
# has been deleted; leaving the timer would fire a missing script every 6h.
- name: Ensure openclaw-sq-import timer is stopped and disabled
  systemd:
    name: openclaw-sq-import.timer
    enabled: no
    state: stopped
    scope: user
    daemon_reload: yes
  failed_when: false

- name: Remove openclaw-sq-import timer unit
  file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-sq-import.timer"
    state: absent
  notify: Reload systemd user

- name: Remove openclaw-sq-import service unit
  file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-sq-import.service"
    state: absent
  notify: Reload systemd user

# qmd search index config
# Was hand-maintained at ~/.config/qmd/index.yml until 2026-08-17; brought under
# Ansible when the Notion collection was repointed from the sync remote to the
# editing clone. No reindex handler on purpose: openclaw-my-docs-pull runs
# `qmd update` hourly, and running it from Ansible would need node on PATH and
# would fail on hosts where qmd isn't installed.
- name: Ensure qmd config directory exists
  file:
    path: "{{ ansible_env.HOME }}/.config/qmd"
    state: directory
    mode: '0755'

- name: Template qmd index config
  template:
    src: qmd-index.yml.j2
    dest: "{{ ansible_env.HOME }}/.config/qmd/index.yml"
    mode: '0644'

# My-Docs Pull (hourly clone refresh)
# Replaces ledger-fetch-all on the sync remote. A fetch from the clone consults
# remote.origin.uploadpack, which runs fetch-all.py on the remote — so this one
# timer both refreshes upstream state and keeps the clone (the agent's read/write
# surface) current. Carries the qmd reindex that ledger-fetch-all.service used to do.
- name: Template openclaw-my-docs-pull service
  template:
    src: openclaw-my-docs-pull.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-my-docs-pull.service"
    mode: '0644'
  notify: Reload systemd user

- name: Template openclaw-my-docs-pull timer
  template:
    src: openclaw-my-docs-pull.timer.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-my-docs-pull.timer"
    mode: '0644'
  notify: Reload systemd user

- name: Enable and start openclaw-my-docs-pull timer
  systemd:
    name: openclaw-my-docs-pull.timer
    enabled: yes
    state: started
    scope: user
    daemon_reload: yes

# Timeline Tick (per-minute marker reminder)
- name: Template openclaw-timeline-tick service
  template:
    src: openclaw-timeline-tick.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-timeline-tick.service"
    # Embeds the heartbeat capability URL.
    mode: '0600'
  notify: Reload systemd user

- name: Template openclaw-timeline-tick timer
  template:
    src: openclaw-timeline-tick.timer.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-timeline-tick.timer"
    mode: '0644'
  notify: Reload systemd user

- name: Enable and start openclaw-timeline-tick timer
  systemd:
    name: openclaw-timeline-tick.timer
    enabled: yes
    state: started
    scope: user
    daemon_reload: yes

# GTasks Shopping (hourly scan -> inbox event)
# Replaced the openclaw cron job "gtasks shopping import" (0e217866), which ran
# an agent turn unconditionally at 06:00 daily. This posts an inbox event only
# when the scan finds candidates, so idle days cost no agent run.
- name: Template openclaw-gtasks-shopping service
  template:
    src: openclaw-gtasks-shopping.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-gtasks-shopping.service"
    mode: '0644'
  notify: Reload systemd user

- name: Template openclaw-gtasks-shopping timer
  template:
    src: openclaw-gtasks-shopping.timer.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/openclaw-gtasks-shopping.timer"
    mode: '0644'
  notify: Reload systemd user

- name: Enable and start openclaw-gtasks-shopping timer
  systemd:
    name: openclaw-gtasks-shopping.timer
    enabled: yes
    state: started
    scope: user
    daemon_reload: yes

# Obsidian Sync (headless continuous)

- name: Ensure obsidian-headless (ob) CLI is installed globally
  community.general.npm:
    name: obsidian-headless
    state: present
    global: true
    executable: "{{ ansible_env.HOME }}/.nvm/versions/node/{{ obsidian_node_version | default('v22.21.1') }}/bin/npm"
  environment:
    PATH: "{{ ansible_env.HOME }}/.nvm/versions/node/{{ obsidian_node_version | default('v22.21.1') }}/bin:{{ ansible_env.PATH }}"

- name: Template obsidian-sync service
  template:
    src: obsidian-sync.service.j2
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/obsidian-sync.service"
    mode: '0644'
  notify: Reload systemd user

- name: Enable and start obsidian-sync service
  systemd:
    name: obsidian-sync.service
    enabled: yes
    state: started
    scope: user
    daemon_reload: yes
